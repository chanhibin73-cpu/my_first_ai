
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数学・物理AIアシスタント</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, sans-serif;
      background: #f4f6fb; color: #202438;
    }
    main { max-width: 720px; margin: auto; padding: 24px 16px 48px; }
    h1 { font-size: 27px; }
    .intro { color: #62697c; line-height: 1.7; }
    .tabs { display: flex; gap: 8px; margin: 22px 0 16px; }
    button { cursor: pointer; font: inherit; }
    .tab {
      flex: 1; padding: 12px 8px; border: 1px solid #ccd2e0;
      border-radius: 10px; background: white;
    }
    .tab.active { background: #263b80; color: white; }
    .panel {
      background: white; border: 1px solid #e0e4ed;
      border-radius: 16px; padding: 18px;
    }
    label { display: block; margin: 14px 0 7px; font-weight: 600; }
    textarea, input {
      display: block; width: 100%; padding: 12px;
      border: 1px solid #cbd1df; border-radius: 9px;
      font: inherit; background: white;
    }
    textarea { min-height: 100px; resize: vertical; }
    .primary {
      margin-top: 16px; padding: 13px; width: 100%;
      color: white; background: #263b80; border: 0; border-radius: 10px;
    }
    .result {
      margin-top: 16px; padding: 14px; background: #f0f3fb;
      border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere;
      line-height: 1.7; min-height: 52px;
    }
    .hint { color: #62697c; font-size: 14px; line-height: 1.6; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>数学・物理AIアシスタント</h1>
  <p class="intro">
    数学や物理の問題を入力してみよう。
    対応できない問題には「学習中です。」と回答します。
  </p>

  <div class="tabs">
    <button class="tab active" id="solveTab">問題を解く</button>
    <button class="tab" id="feedbackTab">間違いを教える</button>
  </div>

  <section class="panel" id="solvePanel">
    <label for="question">質問・問題文</label>
    <textarea id="question" placeholder="例：f(2)を求めてください"></textarea>
    <label for="expression">数式（必要な場合）</label>
    <input id="expression" placeholder="例：f(x)=x**2+3*x">
    <button class="primary" id="solveButton">解く</button>
    <div class="result" id="answer" aria-live="polite">ここに回答が表示されます。</div>
    <p class="hint">例：質問「f(2)を求めてください」／数式「f(x)=x**2+3*x」</p>
  </section>

  <section class="panel" id="feedbackPanel" hidden>
    <p class="hint">AIの回答が間違っていた場合、問題と正しい答えを教えてください。</p>
    <label for="fbQuestion">問題文</label>
    <textarea id="fbQuestion" placeholder="問題文を入力"></textarea>
    <label for="fbAI">AIの回答</label>
    <textarea id="fbAI" placeholder="AIが出した回答を入力"></textarea>
    <label for="fbCorrect">正しい答え・解き方</label>
    <textarea id="fbCorrect" placeholder="正しい答えや解き方を入力"></textarea>
    <button class="primary" id="feedbackButton">間違いを報告する</button>
    <div class="result" id="feedbackStatus" aria-live="polite">報告状況が表示されます。</div>
  </section>
</main>

<script>
  // Renderで公開したPython API
  const API_URL = "https://math-physics-ai-api.onrender.com";

  const solveTab = document.getElementById("solveTab");
  const feedbackTab = document.getElementById("feedbackTab");
  const solvePanel = document.getElementById("solvePanel");
  const feedbackPanel = document.getElementById("feedbackPanel");

  solveTab.addEventListener("click", () => {
    solvePanel.hidden = false;
    feedbackPanel.hidden = true;
    solveTab.classList.add("active");
    feedbackTab.classList.remove("active");
  });

  feedbackTab.addEventListener("click", () => {
    solvePanel.hidden = true;
    feedbackPanel.hidden = false;
    feedbackTab.classList.add("active");
    solveTab.classList.remove("active");
  });

  document.getElementById("solveButton").addEventListener("click", async () => {
    const answer = document.getElementById("answer");
    answer.textContent = "計算中です…";

    try {
      const response = await fetch(API_URL + "/solve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          question: document.getElementById("question").value,
          expression: document.getElementById("expression").value
        })
      });

      if (!response.ok) throw new Error("サーバーエラー");
      const data = await response.json();
      answer.textContent = data.answer || "学習中です。";
    } catch (error) {
      answer.textContent =
        "サーバーに接続できませんでした。少し待ってから、もう一度試してください。";
    }
  });

  document.getElementById("feedbackButton").addEventListener("click", async () => {
    document.getElementById("feedbackStatus").textContent =
      "この報告フォームはまだ保存先に接続されていません。次のステップで保存機能を追加します。";
  });
</script>
</body>
</html>
